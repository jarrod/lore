name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Run full test suite
        if: runner.os != 'Windows'
        run: bun test
      # Bun 1.4 on Windows can lose subprocess output inside `bun test`.
      # Keep deterministic tests in the runner and exercise the compiled CLI,
      # including stdin mutation, in the standalone smoke step below.
      - name: Run Windows tests without subprocess integration harness
        if: runner.os == 'Windows'
        run: bun test ./test/unit/okf.test.ts ./test/integration/index.test.ts
      - run: bun run build
      - run: bun test/smoke.ts

  required:
    name: required
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform check
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
