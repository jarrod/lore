name: Bug report
description: Report reproducible incorrect Lore behavior
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include sensitive knowledge. Report vulnerabilities through the private process in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Lore version
      description: Output from `lore --version`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system and architecture.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include the command, exit code, and compact JSON output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide steps and a redacted portable bundle when practical.
    validations:
      required: true
